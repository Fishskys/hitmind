[project]
name = "hitmind"
version = "0.1.1"
description = "Local-first, lightweight, multi-agent long-term memory service"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0.0,<3"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
hitmind-mcp = "hitmind.mcp.server:main"
hitmind-io = "hitmind.io_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hitmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pragmatic baseline: correctness (pyflakes F), style errors, import order.
# Blind/broad excepts are deliberate fail-open points in adapters/mcp, so the
# opinionated bugbear/bandit/perf rules are intentionally not enabled.
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741"]
